# This override file uses environment variables defined in a .env file.
# Do not commit actual .env files with secrets.

services:
  mp-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=${ASPNETCORE_Kestrel__Certificates__Default__Path}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password}
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION}
      - OpenIddict__SigningCertificate__Path=${OpenIddict__SigningCertificate__Path}
      - OpenIddict__SigningCertificate__Password=${OpenIddict__SigningCertificate__Password}
      - OpenIddict__EncryptionCertificate__Path=${OpenIddict__EncryptionCertificate__Path}
      - OpenIddict__EncryptionCertificate__Password=${OpenIddict__EncryptionCertificate__Password}
      # Left blank these fall back to the committed fixture and the account it carries, which
      # is what makes a fresh checkout come up. A deployment points the file at its own export
      # and gives the administrator a password that is not in the repository.
      - Seed__FileName=${SEED_FILE_NAME}
      - Seed__AdminUsername=${SEED_ADMIN_USERNAME}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD}
    ports:
      - "5001:8080"
      - "5101:8081"
    volumes:
      - ./certs:/https:ro

  mp-database:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "4099:5432"
    restart: unless-stopped
    volumes:
      - db_vol:/var/lib/postgresql/data

  mp-nginx:
    networks:
      main:
        # Fixed so the API can name exactly this address as its trusted proxy. The subnet alone
        # is not enough: the API also publishes ports, and traffic arriving that way is source
        # translated to the gateway - inside the subnet, and able to forge X-Forwarded-For.
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Frontend/miniplat-front/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
