name: miniplat

services:
  mp-api:
    build:
      context: ../Backend
      dockerfile: src/MiniPlat/MiniPlat.Api/Dockerfile
    container_name: mp-api
    depends_on:
      - mp-database
    image: ${DOCKER_REGISTRY-}mp-api
    networks:
      - main

  mp-database:
    container_name: mp-database
    # Pinned to the major version that wrote db_vol. Unpinned, this follows postgres:latest,
    # and 18 both moved the expected mount point to /var/lib/postgresql and refuses to start
    # on a data directory an older major version created.
    image: postgres:17
    networks:
      - main

  mp-fe-builder:
    # No "rm -rf dist/*": vite empties outDir itself, immediately before it writes. Clearing
    # it up front only means the directory nginx serves sits empty for the whole install and
    # build rather than for the moment the files are swapped.
    command: sh -c "mkdir -p dist && npm ci && npm run build"
    container_name: mp-fe-builder
    image: node:20-alpine
    volumes:
      - ../Frontend/miniplat-front:/app
    working_dir: /app

  mp-nginx:
    container_name: mp-nginx
    depends_on:
      mp-api:
        condition: service_started
      # The builder empties dist before it rebuilds. Without waiting for it to finish, nginx
      # serves an empty root for as long as the install and build take - and try_files falling
      # through to a missing /index.html is a redirect cycle, so that window answers 500.
      mp-fe-builder:
        condition: service_completed_successfully
    image: nginx:stable-alpine
    networks:
      - main

networks:
  main:
    driver: bridge
    # Pinned so the API can trust X-Forwarded-For from this network by range. Without a fixed
    # subnet Docker assigns addresses at will, the trust list stops matching, and every client
    # collapses into one rate limit bucket keyed on the proxy.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db_vol:
