name: Backend

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant. Keyed on ref rather
# than SHA: on a SHA key every push gets its own group and nothing ever supersedes anything,
# so the runs pile up instead of the newest one cancelling the ones it has made obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLUTION: Backend/src/MiniPlat/MiniPlat.sln

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Keyed on the project files: they are what pins the package versions, so a lockless
      # restore only needs to run again when one of them changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # Unit tests and integration tests both. The integration suite starts a postgres:17
      # container through Testcontainers, which needs a working Docker daemon - present on
      # ubuntu-latest, so there is nothing to install. No conditional here on purpose: if the
      # test projects ever go missing this step fails, which is the point.
      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build --logger "trx;LogFileName=test-results.trx"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only - nothing is pushed. This exists to catch a Dockerfile that no longer
      # matches the solution (a project added without a matching COPY line restores fine
      # locally and then fails inside the image), which the build job above cannot see.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/src/MiniPlat/MiniPlat.Api/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
